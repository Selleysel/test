<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projects — Your Name</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .proj-layout {
      display: grid;
      grid-template-columns: 1fr 310px; /* shelf | detail panel */
      height: 100%;
    }

    /* ── Disk shelf (left side) ── */
    .disk-shelf { padding: 18px 22px; overflow-y: auto; border-right: .5px solid rgba(0,0,0,.15); }
    .shelf-hdr  { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .shelf-title { font-family: var(--cond); font-size: 1.7rem; font-weight: 900; text-transform: uppercase; line-height: .95; }
    .shelf-meta  { font-family: var(--mono); font-size: 8.5px; letter-spacing: .12em; color: var(--ink-light); text-transform: uppercase; text-align: right; line-height: 1.6; }
    .disk-grid   { display: grid; grid-template-columns: repeat(auto-fill, minmax(95px, 1fr)); gap: 12px; }

    /* ── Detail panel (right side) ── */
    .det-panel  { padding: 18px 16px; display: flex; flex-direction: column; overflow-y: auto; }
    .det-empty  { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100%; gap: 8px; opacity: .3; }
    .det-empty-ico { font-size: 2rem; }
    .det-empty-txt { font-family: var(--mono); font-size: 8.5px; letter-spacing: .15em; text-transform: uppercase; text-align: center; }

    /* Detail content — hidden until a disk is clicked */
    .det     { display: none; flex-direction: column; gap: 11px; }
    .det.vis { display: flex; animation: fup .25s ease forwards; }

    .d-num  { font-family: var(--mono); font-size: 8.5px; letter-spacing: .2em; color: var(--ink-light); text-transform: uppercase; }
    .d-ttl  { font-family: var(--cond); font-size: 1.65rem; font-weight: 900; text-transform: uppercase; line-height: 1; }
    .d-yr   { font-family: var(--mono); font-size: 8.5px; color: var(--ink-light); letter-spacing: .12em; }
    .d-tags { display: flex; flex-wrap: wrap; gap: 3px; }
    .dtag   { font-family: var(--mono); font-size: 7.5px; letter-spacing: .08em; padding: 2px 6px; border: .5px solid rgba(0,0,0,.26); background: rgba(0,0,0,.04); text-transform: uppercase; }
    .d-div  { border: none; border-top: .5px solid rgba(0,0,0,.15); }
    .d-desc { font-size: 11.5px; color: #444; line-height: 1.65; font-weight: 300; }
    .d-row  { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .d-f    { display: flex; flex-direction: column; gap: 1px; }
    .d-fl   { font-family: var(--mono); font-size: 7px; letter-spacing: .15em; color: var(--ink-light); text-transform: uppercase; }
    .d-fv   { font-family: var(--mono); font-size: 9.5px; color: var(--ink); }
    .det-btn { padding: 8px 11px; border: .5px solid rgba(0,0,0,.28); background: var(--ink); color: var(--paper); font-family: var(--mono); font-size: 9px; letter-spacing: .12em; text-transform: uppercase; cursor: pointer; transition: background .15s; }
    .det-btn:hover { background: var(--accent); border-color: var(--accent); }
  </style>
</head>
<body>
<div class="site">
  <div class="gov">
    <div class="gl gl-h" style="top:50%"></div>
    <div class="gl gl-v" style="left:50%"></div>
    <div class="xhair" style="top:50%;left:50%"></div>
    <div class="reg" style="top:0;left:0"></div><div class="reg" style="top:0;right:0"></div>
  </div>

  <header class="topbar">
    <div class="tb-l">
      <button class="back-btn" onclick="navigateTo('index.html')">← HOME</button>
      <span>PROJECTS</span><span>FLOPPY ARCHIVE</span>
    </div>
    <div class="tb-r"><span id="diskCount">— DISKS</span><span>2025</span></div>
  </header>

  <div class="cbar"><div class="cs cs-r"></div><div class="cs cs-o"></div><div class="cs cs-y"></div><div class="cs cs-w"></div><div class="cs cs-h"></div></div>

  <div class="content">
    <div class="page-wrapper" style="height:100%">
      <div class="proj-layout">

        <!-- ── Left: disk shelf ── -->
        <div class="disk-shelf">
          <div class="shelf-hdr">
            <div class="shelf-title">Floppy<br>Archive</div>
            <div class="shelf-meta" id="shelfMeta">LOADING...<br>BY DATE</div>
          </div>
          <!-- Disks injected by JS below -->
          <div class="disk-grid" id="diskGrid"></div>
        </div>

        <!-- ── Right: detail panel ── -->
        <div class="det-panel">
          <div class="det-empty" id="dEmpty">
            <div class="det-empty-ico">💾</div>
            <div class="det-empty-txt">Click a disk<br>to load project</div>
          </div>
          <div class="det" id="dContent">
            <div class="d-num"  id="dNum"></div>
            <div class="d-ttl"  id="dTtl"></div>
            <div class="d-yr"   id="dYr"></div>
            <div class="d-tags" id="dTags"></div>
            <hr class="d-div">
            <div class="d-desc" id="dDesc"></div>
            <div class="d-row">
              <div class="d-f"><span class="d-fl">Role</span><span class="d-fv" id="dRole"></span></div>
              <div class="d-f"><span class="d-fl">Status</span><span class="d-fv" id="dStat"></span></div>
              <div class="d-f"><span class="d-fl">Team</span><span class="d-fv" id="dTeam"></span></div>
              <div class="d-f"><span class="d-fl">Duration</span><span class="d-fv" id="dDur"></span></div>
            </div>
            <hr class="d-div">
            <button class="det-btn" onclick="navigateTo('project-detail.html')">→ Full Case Study</button>
          </div>
        </div>

      </div>
    </div>
  </div>

  <div class="cbar"><div class="cs cs-r"></div><div class="cs cs-o"></div><div class="cs cs-y"></div><div class="cs cs-w"></div><div class="cs cs-h"></div></div>
  <footer class="bbar">
    <div class="bb-l">YOUR-NAME<br>PROJECTS</div><!-- ← CHANGE -->
    <div class="bb-c">FLOPPY ARCHIVE · SHIPPED WORK</div>
    <div class="bb-r">CLICK DISK<br>TO INSPECT</div>
  </footer>
</div>

<script src="nav.js"></script>
<script>
/* ============================================================
   PROJECTS DATA
   ── Add a project by copying one of the objects below.
   ── col options: col-r (red), col-a (amber), col-b (blue),
                   col-g (green), col-p (purple)
   ── Keep id sequential (001, 002, …)
   ============================================================ */
const PROJECTS = [
  {
    id: '001', col: 'col-r',
    title: 'Project Alpha', lbl: 'ALPHA', yr: '2024',
    tags: ['React', 'TypeScript', 'PostgreSQL'],
    desc: 'Full-stack application solving a specific user problem. Highlight scale, technical challenge, or business impact here.',
    role: 'Full-Stack', status: 'Shipped', team: 'Solo', dur: '3 months',
  },
  {
    id: '002', col: 'col-a',
    title: 'Project Beta', lbl: 'BETA', yr: '2024',
    tags: ['Go', 'gRPC', 'Redis'],
    desc: 'Backend-focused project built for performance. Handles high request volume with low latency.',
    role: 'Backend', status: 'Shipped', team: '2 people', dur: '2 months',
  },
  {
    id: '003', col: 'col-b',
    title: 'Project Gamma', lbl: 'GAMMA', yr: '2023',
    tags: ['Rust', 'WASM', 'CLI'],
    desc: 'Open-source CLI tool solving a developer pain point. Published with active community use.',
    role: 'Author', status: 'Open Source', team: 'Solo', dur: '6 weeks',
  },
  {
    id: '004', col: 'col-g',
    title: 'Project Delta', lbl: 'DELTA', yr: '2023',
    tags: ['Next.js', 'Tailwind', 'Prisma'],
    desc: 'Full-stack web app with polished UI and clean data layer. Shipped to production with real users.',
    role: 'Full-Stack', status: 'Shipped', team: '3 people', dur: '4 months',
  },
  {
    id: '005', col: 'col-p',
    title: 'Epsilon', lbl: 'EPSLN', yr: '2025',
    tags: ['Python', 'FastAPI', 'ML'],
    desc: 'ML pipeline and API for a data-driven application. Currently in active development.',
    role: 'Backend/ML', status: 'In Progress', team: 'Solo', dur: 'Ongoing',
  },
];

// Update topbar count
document.getElementById('diskCount').textContent = `${PROJECTS.length} DISKS`;
document.getElementById('shelfMeta').innerHTML   = `${PROJECTS.length} DISKS<br>BY DATE`;

const grid = document.getElementById('diskGrid');

PROJECTS.forEach(p => {
  const el = document.createElement('div');
  el.className = `floppy ${p.col}`;
  el.innerHTML = `
    <div class="disk-body">
      <div class="disk-notch"></div>
      <div class="disk-sht"></div>
      <div class="disk-lbl">
        <div class="disk-lt">${p.lbl}</div>
        <div class="disk-ll"></div>
        <div class="disk-ls">${p.id}·${p.yr}</div>
      </div>
    </div>
    <div class="floppy-nm">${p.title}</div>
  `;

  el.addEventListener('click', () => {
    // Deselect all, select clicked
    document.querySelectorAll('.floppy').forEach(f => f.classList.remove('sel'));
    el.classList.add('sel');

    // Show detail panel with animation
    document.getElementById('dEmpty').style.display = 'none';
    const dc = document.getElementById('dContent');
    dc.classList.remove('vis');
    void dc.offsetWidth; // force reflow to restart animation
    dc.classList.add('vis');

    // Populate fields
    document.getElementById('dNum').textContent  = `DISK_${p.id}`;
    document.getElementById('dTtl').textContent  = p.title;
    document.getElementById('dYr').textContent   = `YEAR: ${p.yr}`;
    document.getElementById('dTags').innerHTML   = p.tags.map(t => `<span class="dtag">${t}</span>`).join('');
    document.getElementById('dDesc').textContent = p.desc;
    document.getElementById('dRole').textContent = p.role;
    document.getElementById('dStat').textContent = p.status;
    document.getElementById('dTeam').textContent = p.team;
    document.getElementById('dDur').textContent  = p.dur;
  });

  grid.appendChild(el);
});
</script>
</body>
</html>
