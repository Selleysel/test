<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Résumé — Your Name</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .resume-layout {
      display: grid;
      grid-template-columns: 200px 1fr;
      height: 100%;
    }

    /* ── section nav ── */
    .resume-nav {
      border-right: 0.5px solid rgba(0,0,0,0.2);
      padding: 20px 0;
      display: flex;
      flex-direction: column;
    }
    .rnav-header {
      font-family: var(--mono);
      font-size: 9px; letter-spacing: 0.18em;
      color: var(--ink-light); text-transform: uppercase;
      padding: 0 16px; margin-bottom: 10px;
    }
    .rnav-item {
      display: flex; align-items: center; gap: 8px;
      padding: 9px 16px;
      font-size: 12.5px; color: #555;
      cursor: pointer;
      border-left: 2px solid transparent;
      transition: color 0.15s, background 0.15s;
    }
    .rnav-item:hover { color: var(--ink); background: rgba(0,0,0,0.04); }
    .rnav-item.active {
      color: var(--ink);
      border-left-color: var(--accent);
      background: rgba(0,0,0,0.03);
      font-weight: 500;
    }
    .rnav-icon {
      font-family: var(--mono); font-size: 10px;
      color: inherit; min-width: 16px;
    }

    .rnav-divider { border: none; border-top: 0.5px solid rgba(0,0,0,0.15); margin: 8px 16px; }

    .pdf-btn {
      margin: auto 12px 12px;
      padding: 10px 12px;
      background: var(--ink); color: var(--paper);
      font-family: var(--mono); font-size: 9.5px;
      letter-spacing: 0.12em; text-transform: uppercase;
      border: none; cursor: pointer;
      display: flex; align-items: center; gap: 8px;
      justify-content: center;
      transition: background 0.15s;
    }
    .pdf-btn:hover { background: var(--accent); }

    /* ── resume content ── */
    .resume-content {
      overflow-y: auto;
      padding: 28px 36px;
      scroll-behavior: smooth;
    }
    .resume-content::-webkit-scrollbar { width: 4px; }
    .resume-content::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.15); }

    .resume-header-block {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: end;
      padding-bottom: 16px;
      border-bottom: 0.5px solid rgba(0,0,0,0.2);
      margin-bottom: 28px;
    }
    .resume-name {
      font-family: var(--condensed);
      font-size: clamp(2.5rem, 5vw, 4rem);
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.01em;
      line-height: 0.93;
    }
    .resume-contact-line {
      font-family: var(--mono);
      font-size: 9px; letter-spacing: 0.1em;
      color: var(--ink-light); text-transform: uppercase;
      text-align: right; line-height: 1.8;
    }

    /* ── resume section ── */
    .resume-section {
      margin-bottom: 32px;
      scroll-margin-top: 20px;
    }

    .section-heading {
      display: flex; align-items: center; gap: 12px;
      margin-bottom: 14px;
    }
    .section-label {
      font-family: var(--condensed);
      font-size: 1.1rem; font-weight: 900;
      text-transform: uppercase; letter-spacing: 0.06em;
      white-space: nowrap;
    }
    .section-line {
      flex: 1; height: 0.5px; background: rgba(0,0,0,0.25);
    }
    .section-num {
      font-family: var(--mono); font-size: 9px;
      color: var(--ink-light); letter-spacing: 0.1em;
      white-space: nowrap;
    }

    /* summary */
    .summary-text {
      font-size: 13.5px; color: #444; line-height: 1.7;
      font-weight: 300; max-width: 660px;
      border-left: 2px solid var(--accent);
      padding-left: 14px;
    }

    /* experience & education */
    .entry {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 4px 16px;
      padding: 14px 0;
      border-bottom: 0.5px solid rgba(0,0,0,0.1);
    }
    .entry:last-child { border-bottom: none; }

    .entry-title { font-size: 14px; font-weight: 600; }
    .entry-date {
      font-family: var(--mono); font-size: 9.5px;
      color: var(--ink-light); letter-spacing: 0.1em;
      white-space: nowrap; margin-top: 2px;
    }
    .entry-org {
      font-size: 12.5px; color: #555;
      grid-column: 1;
    }
    .entry-bullets {
      grid-column: 1 / -1;
      padding-left: 14px;
      margin-top: 6px;
    }
    .entry-bullets li {
      font-size: 12.5px; color: #444;
      line-height: 1.6; font-weight: 300;
      margin-bottom: 3px;
    }

    /* projects */
    .proj-entry {
      padding: 12px 0;
      border-bottom: 0.5px solid rgba(0,0,0,0.1);
      display: flex; flex-direction: column; gap: 4px;
    }
    .proj-entry:last-child { border-bottom: none; }
    .proj-entry-header { display: flex; align-items: baseline; gap: 10px; }
    .proj-entry-name { font-size: 13.5px; font-weight: 600; }
    .proj-entry-stack {
      font-family: var(--mono); font-size: 9px;
      color: var(--ink-light); letter-spacing: 0.08em;
    }
    .proj-entry-desc {
      font-size: 12.5px; color: #444; line-height: 1.6; font-weight: 300;
    }

    /* leadership */
    .lead-entry {
      padding: 12px 0;
      border-bottom: 0.5px solid rgba(0,0,0,0.1);
      display: grid; grid-template-columns: 1fr auto; gap: 4px;
    }
    .lead-entry:last-child { border-bottom: none; }
    .lead-title { font-size: 13.5px; font-weight: 600; }
    .lead-org { font-size: 12.5px; color: #555; grid-column: 1; }
    .lead-date { font-family: var(--mono); font-size: 9.5px; color: var(--ink-light); letter-spacing: 0.1em; }
    .lead-desc { font-size: 12.5px; color: #444; line-height: 1.6; font-weight: 300; grid-column: 1 / -1; margin-top: 4px; }

    /* skills */
    .skills-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 10px;
    }
    .skill-group {
      border: 0.5px solid rgba(0,0,0,0.18);
      padding: 12px;
      background: var(--paper);
    }
    .skill-group-label {
      font-family: var(--mono); font-size: 8.5px;
      letter-spacing: 0.15em; color: var(--ink-light);
      text-transform: uppercase; margin-bottom: 7px;
    }
    .skill-pills { display: flex; flex-wrap: wrap; gap: 4px; }
    .skill-pill {
      font-family: var(--mono); font-size: 9px;
      padding: 2px 7px;
      border: 0.5px solid rgba(0,0,0,0.25);
      letter-spacing: 0.06em; background: rgba(0,0,0,0.04);
    }
  </style>
</head>
<body>
  <div class="page-wrapper">

    <div class="grid-overlay">
      <div class="gl gl-v" style="left:200px"></div>
      <div class="reg-mark" style="top:28px;left:0"></div>
      <div class="reg-mark" style="top:28px;right:0"></div>
    </div>

    <header class="topbar">
      <div class="topbar-left">
        <a href="index.html" data-nav style="color:inherit;text-decoration:none;letter-spacing:0.13em;">← HOME</a>
        <span>RÉSUMÉ</span>
        <span>CURRICULUM VITAE</span>
      </div>
      <div class="topbar-right">
        <span>6 SECTIONS</span>
        <span>2025</span>
      </div>
    </header>

    <div class="color-bar top">
      <div class="cs cs-red"></div><div class="cs cs-orange"></div>
      <div class="cs cs-yellow"></div><div class="cs cs-white"></div>
      <div class="cs cs-hatch"></div>
    </div>

    <div class="content-area">
      <div class="resume-layout">

        <!-- section nav -->
        <nav class="resume-nav">
          <div class="rnav-header">// Sections</div>
          <div class="rnav-item active" data-target="sec-summary"><span class="rnav-icon">§</span>Summary</div>
          <div class="rnav-item" data-target="sec-experience"><span class="rnav-icon">§</span>Experience</div>
          <div class="rnav-item" data-target="sec-education"><span class="rnav-icon">§</span>Education</div>
          <div class="rnav-item" data-target="sec-projects"><span class="rnav-icon">§</span>Projects</div>
          <div class="rnav-item" data-target="sec-leadership"><span class="rnav-icon">§</span>Leadership</div>
          <div class="rnav-item" data-target="sec-skills"><span class="rnav-icon">§</span>Skills</div>
          <hr class="rnav-divider">
          <button class="pdf-btn" onclick="downloadPDF()">↓ Download PDF</button>
        </nav>

        <!-- resume body -->
        <div class="resume-content" id="resumeContent">

          <!-- name header -->
          <div class="resume-header-block">
            <div class="resume-name">Ansel<br>Chua</div>
            <div class="resume-contact-line">
            </div>
          </div>

          <!-- SUMMARY -->
          <section class="resume-section" id="sec-summary">
            <div class="section-heading">
              <span class="section-label">Summary</span>
              <div class="section-line"></div>
              <span class="section-num">01</span>
            </div>
            <p class="summary-text">
            </p>
          </section>

          <!-- EXPERIENCE -->
          <section class="resume-section" id="sec-experience">
            <div class="section-heading">
              <span class="section-label">Experience</span>
              <div class="section-line"></div>
              <span class="section-num">02</span>
            </div>
            <div class="entry">
              <div class="entry-title"></div>
              <div class="entry-date"></div>
              <div class="entry-org"></div>
              <ul class="entry-bullets">
              </ul>
            </div>
          </section>

          <!-- EDUCATION -->
          <section class="resume-section" id="sec-education">
            <div class="section-heading">
              <span class="section-label">Education</span>
              <div class="section-line"></div>
              <span class="section-num">03</span>
            </div>
            <div class="entry">
              <div class="entry-title"></div>
              <div class="entry-date"></div>
              <div class="entry-org"></div>
              <ul class="entry-bullets">
              </ul>
            </div>
          </section>

          <!-- PROJECTS -->
          <section class="resume-section" id="sec-projects">
            <div class="section-heading">
              <span class="section-label">Projects</span>
              <div class="section-line"></div>
              <span class="section-num">04</span>
            </div>
            <div class="proj-entry">
              <div class="proj-entry-header">
                <span class="proj-entry-name"></span>
                <span class="proj-entry-stack"></span>
              </div>
              <div class="proj-entry-desc"></div>
            </div>
          </section>

          <!-- LEADERSHIP -->
          <section class="resume-section" id="sec-leadership">
            <div class="section-heading">
              <span class="section-label">Leadership & Campus</span>
              <div class="section-line"></div>
              <span class="section-num">05</span>
            </div>
            <div class="lead-entry">
              <div class="lead-title"></div>
              <div class="lead-date"></div>
              <div class="lead-org"></div>
              <div class="lead-desc"></div>
            </div>
          </section>

          <!-- SKILLS -->
          <section class="resume-section" id="sec-skills">
            <div class="section-heading">
              <span class="section-label">Skills</span>
              <div class="section-line"></div>
              <span class="section-num">06</span>
            </div>

            <div class="skills-grid">
              <!-- Dynamic skill pills will be injected here -->
            </div>
          </section>


        </div>
      </div>
    </div>

    <div class="color-bar bottom">
      <div class="cs cs-red"></div><div class="cs cs-orange"></div>
      <div class="cs cs-yellow"></div><div class="cs cs-white"></div>
      <div class="cs cs-hatch"></div>
    </div>
    <footer class="bottom-bar">
      <div class="bb-left">YOUR-NAME<br>RÉSUMÉ</div>
      <div class="bb-center">YOUR NAME · CURRICULUM VITAE</div>
      <div class="bb-right">REV 2025<br>OPEN TO WORK</div>
    </footer>
  </div>

  <script src="nav.js"></script>
  <script src="data.js"></script>
  <script>
    // section nav scroll spy
    const navItems = document.querySelectorAll('.rnav-item');
    navItems.forEach(item => {
      item.addEventListener('click', () => {
        const target = document.getElementById(item.dataset.target);
        if (target) {
          target.scrollIntoView({ behavior: 'smooth', block: 'start' });
          navItems.forEach(n => n.classList.remove('active'));
          item.classList.add('active');
        }
      });
    });

    // scroll spy update
    const content = document.getElementById('resumeContent');
    const sections = document.querySelectorAll('.resume-section');
    content.addEventListener('scroll', () => {
      let current = '';
      sections.forEach(sec => {
        if (sec.offsetTop - content.offsetTop <= content.scrollTop + 60) {
          current = sec.id;
        }
      });
      navItems.forEach(item => {
        item.classList.toggle('active', item.dataset.target === current);
      });
    });

    function downloadPDF() {
      window.print();
    }
  </script>

  <style media="print">
    .page-wrapper { position: static !important; }
    .topbar, .color-bar, .bottom-bar, .resume-nav, .grid-overlay { display: none !important; }
    .content-area { position: static !important; overflow: visible !important; top: 0 !important; bottom: 0 !important; }
    .resume-layout { grid-template-columns: 1fr !important; }
    .resume-content { padding: 20px !important; overflow: visible !important; }
    body, html { overflow: visible !important; height: auto !important; background: white !important; }
  </style>
</body>
</html>
